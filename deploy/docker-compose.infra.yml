# PostgreSQL 17 + Redis 7 独立部署；在 deploy 目录通过 --env-file 指定密码配置。
# 固定项目名以隔离其他 Compose 部署的数据卷和网络。
name: sub2api-infra

services:
  postgres:
    image: postgres:17-alpine
    container_name: sub2api-postgres17
    restart: unless-stopped
    # 仅供本机访问，避开现有 PostgreSQL 的 5432 端口。
    ports:
      - "127.0.0.1:${SUB2API_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在环境文件中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 使用独立命名卷，避免混用其他 PostgreSQL 大版本的数据目录。
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      # 通过 TCP 实际执行查询，确认数据库可以使用账号密码连接。
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql
          -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -Atqc 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sub2api-redis7
    restart: unless-stopped
    # 仅供本机访问，避开现有 Redis 的 6379 端口。
    ports:
      - "127.0.0.1:${SUB2API_REDIS_PORT:-6380}:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在环境文件中设置 REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    # 参数列表直接传递密码，避免 shell 解释密码中的特殊字符。
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?请在环境文件中设置 REDIS_PASSWORD}
    volumes:
      - redis7_data:/data
    healthcheck:
      # 校验实际 PONG 响应，避免认证错误被误判为健康。
      test: ["CMD-SHELL", "[ \"$$(redis-cli --raw ping)\" = PONG ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres17_data:
  redis7_data:
